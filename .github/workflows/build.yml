name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build the app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BubbleTranslate.apk

      # Google's own checks: is the signature valid, and can Android read
      # the app's description? If either fails, the phone would call the
      # app "invalid", so stop here instead of publishing it.
      - name: Check the APK
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs BubbleTranslate.apk
          "$BT/aapt2" dump badging BubbleTranslate.apk | head -20
          SIZE=$(stat -c %s BubbleTranslate.apk)
          SHA=$(sha256sum BubbleTranslate.apk | cut -d' ' -f1)
          {
            echo "Version: $GITHUB_SHA"
            echo "Size: $SIZE bytes ($((SIZE / 1048576)) MB)"
            echo "SHA-256: $SHA"
            echo
            echo "If the file on your phone is smaller than this, the download broke. Delete it and download again."
          } > release-notes.txt
          cat release-notes.txt

      - uses: actions/upload-artifact@v4
        with:
          name: BubbleTranslate-apk
          path: BubbleTranslate.apk

      # Puts the APK on the repo's Releases page so it can be
      # downloaded straight from a phone browser.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: BubbleTranslate.apk
          body_path: release-notes.txt
          make_latest: true
